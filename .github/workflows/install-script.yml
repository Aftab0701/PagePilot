name: Test PagePilot CLI Install

on:
  push:
    branches:
      - main
    paths:
      - 'pagepilot/cli.py'
      - 'pagepilot/skills/**'
      - 'skills/pagepilot/SKILL.md'
      - 'pagepilot/skills/pagepilot/SKILL.md'
      - 'scripts/sync_browser_harness_skill.py'
      - 'pyproject.toml'
      - '.github/workflows/install-script.yml'
  pull_request:
    paths:
      - 'pagepilot/cli.py'
      - 'pagepilot/skills/**'
      - 'skills/pagepilot/SKILL.md'
      - 'pagepilot/skills/pagepilot/SKILL.md'
      - 'scripts/sync_browser_harness_skill.py'
      - 'pyproject.toml'
      - '.github/workflows/install-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pagepilot-skill:
    name: pagepilot skill sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generated PagePilot skill
        run: python3 scripts/sync_browser_harness_skill.py --check

  test-pip-install:
    name: uv pip install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create venv and install pagepilot
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv .

      - name: Add venv to PATH
        run: |
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "$PWD/.venv/Scripts" >> $GITHUB_PATH

      - name: Verify PagePilot CLI
        run: |
          pagepilot --help
          pagepilot auth --help
          pagepilot skill show

      - name: Verify aliases
        run: |
          pilot --help
          bu --help
          browser --help

  test-uvx-local-wheel:
    name: uvx pagepilot from local wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build wheel from current branch
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install build
          python -m build --wheel

      - name: Verify uvx PagePilot CLI
        run: |
          WHEEL=$(ls dist/*.whl)
          uvx --from "$WHEEL" pagepilot --help
          uvx --from "$WHEEL" pagepilot auth --help
          uvx --from "$WHEEL" pagepilot skill show

  test-uvx-pypi:
    name: uvx pagepilot[cli] from PyPI
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify uvx PagePilot CLI
        run: |
          uvx "pagepilot[cli]" --help
          uvx "pagepilot[cli]" auth --help
          uvx "pagepilot[cli]" skill show
