[project]
name = "pagepilot"
version = "0.1.0"
description = "Autonomous web navigation agent with an intentional, calm, and production-grade interface."
authors = [{ name = "PagePilot Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
agent = [
    "browser-use>=0.1.48",
    "langchain-google-genai",
    "langchain-openai",
    "langchain-anthropic",
    "playwright>=1.40.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

